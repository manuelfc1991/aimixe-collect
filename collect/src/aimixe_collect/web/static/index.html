<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AImixE Data Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><span class="brand-name">AImixE</span><span class="brand-sub">Data Collection</span></div>
    <label class="lang-switch" id="lang-switch" title="Current language">
      <span class="lang-code mono" id="switch-code">—</span>
      <span class="lang-name" id="switch-name">Choose a language</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 10l5 5 5-5"></path></svg>
      <select id="lang-select" aria-label="Language"><option value="">— choose —</option></select>
    </label>
    <nav class="nav" id="nav">
      <button data-view="home" title="Languages" class="nav-item global"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg><span>Languages</span></button>
      <span class="nav-group">Collect</span>
      <button data-view="catalogue" title="Online Collection — Catalogue Search" class="nav-item needs-lang"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span>Catalogue search</span></button>
      <button data-view="agent" title="Online Collection — Agent Search" class="nav-item needs-lang"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.3L20 10l-4.3 3.8 1.3 5.7L12 16.6 7 19.5l1.3-5.7L4 10l5.8-1.7z"></path></svg><span>Agent search</span></button>
      <button data-view="offline" title="Offline Collection" class="nav-item needs-lang"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h6l2 2h10v10H3z"></path></svg><span>Offline collection</span></button>
      <button data-view="import" title="Import Files / Folder" class="nav-item needs-lang"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"></path></svg><span>Import files</span></button>
      <span class="nav-group">Language</span>
      <button data-view="profile" title="Language Profile" class="nav-item needs-lang"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg><span>Profile</span><span class="nav-count mono" id="nav-profile-count"></span></button>
      <button data-view="collection" title="View Existing Collection" class="nav-item needs-lang"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg><span>Collection</span><span class="nav-count mono" id="nav-collection-count"></span></button>
      <button data-view="review" title="Review Queue" class="nav-item global"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"></path></svg><span>Review queue</span><span class="badge hidden" id="review-badge"></span></button>
      <div class="nav-spacer"></div>
      <button data-view="history" title="Collection History" class="nav-item global"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg><span>History</span></button>
      <button data-view="settings" title="Settings" class="nav-item global"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg><span>Settings</span></button>
      <a href="/guide" target="_blank" rel="noopener" title="User Guide" class="nav-item"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h6v18H6a2 2 0 0 0-2 2z"></path><path d="M20 5a2 2 0 0 0-2-2h-6v18h6a2 2 0 0 1 2 2z"></path></svg><span>User guide</span></a>
      <div class="side-status" id="side-status"></div>
    </nav>
  </aside>

  <div class="stage">
    <div class="glow"></div>
    <header class="topbar">
      <form class="jump" id="jump-form">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="jump-input" placeholder="Search a language or jump to…" autocomplete="off">
        <span class="kbd">/</span>
      </form>
      <span class="mono topbar-version" id="version" title=""></span>
    </header>
    <main id="main">
      <section id="view-home" class="view"></section>
      <section id="view-find" class="view hidden"></section>
      <section id="view-profile" class="view hidden"></section>
      <section id="view-catalogue" class="view hidden"></section>
      <section id="view-agent" class="view hidden"></section>
      <section id="view-offline" class="view hidden"></section>
      <section id="view-import" class="view hidden"></section>
      <section id="view-collection" class="view hidden"></section>
      <section id="view-review" class="view hidden"></section>
      <section id="view-history" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
      <section id="view-catalogues" class="view hidden"></section>
    </main>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
